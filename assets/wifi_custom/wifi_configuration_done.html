<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>MeBot IoT — Conectado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0F172A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: -30%; left: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 60%);
            filter: blur(100px);
            z-index: 0;
            animation: auraFloat 6s ease-in-out infinite;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -30%; right: -20%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(253, 224, 71, 0.15) 0%, transparent 60%);
            filter: blur(100px);
            z-index: 0;
            animation: auraFloat 6s ease-in-out infinite reverse;
        }

        @keyframes auraFloat {
            0%, 100% { transform: translate(0, 0); opacity: 0.5; }
            50% { transform: translate(30px, -30px); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 420px;
            width: 100%;
        }

        /* MeBot Logo SVG */
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        /* Checkmark animado */
        .checkmark-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .checkmark-circle {
            fill: none;
            stroke: #10B981;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 170;
            stroke-dashoffset: 170;
            animation: drawCircle 0.8s ease-out forwards;
        }

        .checkmark-check {
            fill: none;
            stroke: #10B981;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.5s ease-out 0.6s forwards;
        }

        @keyframes drawCircle {
            to { stroke-dashoffset: 0; }
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        /* Glow ring alrededor del checkmark */
        .glow-ring {
            position: absolute;
            top: -10px; left: -10px;
            width: 140px; height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(16, 185, 129, 0.2);
            animation: ringPulse 2s ease-in-out infinite;
        }

        .glow-ring:nth-child(2) {
            top: -20px; left: -20px;
            width: 160px; height: 160px;
            animation-delay: 0.5s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.1; }
        }

        .brand-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #3B82F6;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.3rem;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #F8FAFC, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: #10B981;
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .highlight {
            color: #FDE047;
            font-weight: 800;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Particle dots */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #3B82F6;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 4s ease-in-out infinite;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 20%; top: 60%; animation-delay: 0.5s; }
        .particle:nth-child(3) { left: 50%; top: 10%; animation-delay: 1s; }
        .particle:nth-child(4) { left: 70%; top: 40%; animation-delay: 1.5s; }
        .particle:nth-child(5) { left: 85%; top: 70%; animation-delay: 2s; }
        .particle:nth-child(6) { left: 40%; top: 80%; animation-delay: 2.5s; }
        .particle:nth-child(7) { left: 90%; top: 15%; animation-delay: 3s; }
        .particle:nth-child(8) { left: 5%; top: 80%; animation-delay: 3.5s; }

        @keyframes particleFloat {
            0%, 100% { opacity: 0; transform: translateY(0) scale(0); }
            25% { opacity: 0.6; }
            50% { opacity: 0.3; transform: translateY(-30px) scale(1); }
            75% { opacity: 0.6; }
        }

        /* Status bar */
        .status-bar {
            margin-top: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #64748B;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            animation: statusBlink 1.5s ease-in-out infinite;
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <!-- MeBot Logo -->
        <div class="logo">
            <svg width="72" height="72" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M14 19C11.7909 19 10 20.7909 10 23V43C10 45.2091 11.7909 47 14 47H46C48.2091 47 50 45.2091 50 43V23C50 20.7909 48.2091 19 46 19H14ZM18 27H26V33H18V27ZM34 27H42V33H34V27ZM24 39H36V42H24V39Z" fill="#3B82F6"/>
                <rect x="6" y="28" width="4" height="12" rx="2" fill="#3B82F6"/>
                <rect x="50" y="28" width="4" height="12" rx="2" fill="#3B82F6"/>
                <line x1="30" y1="14" x2="30" y2="19" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
                <circle cx="30" cy="14" r="3" fill="#3B82F6"/>
            </svg>
        </div>

        <!-- Checkmark animado con anillos -->
        <div class="checkmark-container">
            <div class="glow-ring"></div>
            <div class="glow-ring"></div>
            <svg viewBox="0 0 60 60" width="120" height="120">
                <circle class="checkmark-circle" cx="30" cy="30" r="26"/>
                <path class="checkmark-check" d="M18 30l9 9 15-15"/>
            </svg>
        </div>

        <div class="brand-name">MeBot IoT</div>
        <h1 class="title">Conectado exitosamente</h1>
        <p class="subtitle">
            <span class="highlight">tu robot ya tiene vida!</span>
        </p>

        <div class="status-bar">
            <span class="status-dot"></span>
            <span>Inicializando conexión</span>
        </div>

        <div class="footer">MeBot IoT by Nativo Technology</div>
    </div>

    <style>
        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            .logo { width: 56px; height: 56px; margin-bottom: 1rem; }
            .checkmark-container { width: 96px; height: 96px; margin-bottom: 1.5rem; }
            .checkmark-container svg { width: 96px; height: 96px; }
            .glow-ring { width: 116px; height: 116px; top: -10px; left: -10px; }
            .glow-ring:nth-child(2) { width: 136px; height: 136px; top: -20px; left: -20px; }
            .title { font-size: 1.3rem; }
            .subtitle { font-size: 0.95rem; }
            .particle { width: 3px; height: 3px; }
        }
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                fetch('/exit', { method: 'POST' })
                    .then(function(r) {
                        if (r.ok) console.log('Exit config mode request sent');
                        else console.error('Failed to send exit request');
                    })
                    .catch(function(e) {
                        console.error('Error:', e);
                    });
            }, 1000);
        });
    </script>
</body>
</html>
